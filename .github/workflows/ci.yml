name: CI

on:
  push:
  pull_request:

jobs:
  blargg-tests:
    name: Blargg CPU Test
    runs-on: ubuntu-latest
    container: gcc:16.2.0

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: python3 .github/scripts/install_deps.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DBUILD_APP=OFF -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run test ROMs
        run: ctest --test-dir build --output-on-failure -LE known_fail --output-junit results.xml

      - name: Run known-fail ROMs
        if: success() || failure()
        run: ctest --test-dir build -L known_fail --output-junit known-fail.xml || true

      - name: Test report
        if: always()
        run: python3 .github/scripts/test_report.py build/results.xml --known-fail build/known-fail.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xml

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    container: gcc:16.2.0

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: python3 .github/scripts/install_deps.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DBUILD_APP=OFF -DBUILD_TESTS=ON -DFETCH_TEST_ROMS=ON -DGB_SANITIZE=ON -DGB_TEST_TIMEOUT=600 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run test ROMs
        run: ctest --test-dir build --output-on-failure -L "cpu|mbc" -LE known_fail

  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pip install clang-format==23.1.1

      - name: Run clang-format
        run: clang-format --dry-run --Werror $(find src include tests -name '*.cpp' -o -name '*.h')
